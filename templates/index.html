<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WellView helps you upload, analyze, save, and compare medical reports.">
    <title>Welcome to WellView</title>
    <!-- Google Fonts Poppins & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Inline styles for instant loading and custom full-screen design -->
    <style>
        :root {
            --primary: #0066ff;
            --primary-alt: #00d4ff;
            --accent-alt: #a200ff;
            --bg-dark: #0b0f19;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Ambient glow background */
        .ambient-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 102, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(162, 0, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 50%);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* floating medical grids */
        .grid-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image: 
                linear-gradient(rgba(0, 102, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 102, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
        }

        /* Splash container */
        .splash-container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Pulse heartbeat ring */
        .heartbeat-ring-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            opacity: 0;
            animation: pulseRing 3s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
        }

        .ring:nth-child(2) {
            animation-delay: 1s;
            border-color: var(--primary-alt);
        }

        .ring:nth-child(3) {
            animation-delay: 2s;
            border-color: var(--accent-alt);
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .heart-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-alt) 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 0 30px rgba(0, 102, 255, 0.5);
            z-index: 3;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            35% { transform: scale(1.05); }
            45% { transform: scale(1.15); }
        }

        /* Branding */
        .brand-logo-text {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-alt) 50%, var(--accent-alt) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 10px;
            animation: fadeUp 1.2s ease-out forwards;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            max-width: 480px;
            line-height: 1.5;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 0.3s forwards;
        }

        /* Heartbeat trace line */
        .ecg-container {
            width: 280px;
            height: 60px;
            margin: 10px 0;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.6s forwards;
        }

        .ecg-line {
            width: 100%;
            height: 100%;
        }

        .ecg-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawECG 4s linear infinite;
        }

        @keyframes drawECG {
            0% { stroke-dashoffset: 1000; }
            70% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -1000; }
        }

        /* Instruction prompt */
        .enter-prompt {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--primary-alt);
            text-transform: uppercase;
            margin-top: 20px;
            opacity: 0;
            animation: breathePrompt 2s ease-in-out infinite, fadeUp 1.2s ease-out 0.9s forwards;
        }

        @keyframes breathePrompt {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(2px); }
        }

        /* Floating medical particles */
        .particle {
            position: absolute;
            color: rgba(0, 212, 255, 0.12);
            font-size: 1.6rem;
            pointer-events: none;
            z-index: 1;
            animation: floatSlow 8s ease-in-out infinite alternate;
        }

        .p1 { top: 15%; left: 15%; animation-duration: 6s; }
        .p2 { top: 25%; right: 18%; animation-duration: 9s; animation-delay: 1s; }
        .p3 { bottom: 22%; left: 20%; animation-duration: 7s; animation-delay: 2s; }
        .p4 { bottom: 18%; right: 15%; animation-duration: 10s; }
        .p5 { top: 65%; left: 10%; animation-duration: 8s; }
        .p6 { top: 55%; right: 12%; animation-duration: 11s; animation-delay: 1.5s; }

        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(0deg) scale(0.9); }
            100% { transform: translateY(-30px) rotate(20deg) scale(1.1); }
        }

        /* Page transition overlay */
        .transition-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* Animation utilities */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="grid-overlay"></div>
    
    <!-- Floating icons -->
    <div class="particle p1"><i class="bi bi-activity"></i></div>
    <div class="particle p2"><i class="bi bi-heart-pulse"></i></div>
    <div class="particle p3"><i class="bi bi-capsule"></i></div>
    <div class="particle p4"><i class="bi bi-clipboard2-pulse"></i></div>
    <div class="particle p5"><i class="bi bi-shield-plus"></i></div>
    <div class="particle p6"><i class="bi bi-virus2"></i></div>

    <div class="splash-container">
        <div class="heartbeat-ring-container">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="heart-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
        </div>

        <h1 class="brand-logo-text">WellView</h1>
        <p class="tagline">Interactive workspace for health report diagnostics. Upload, analyze, track, and compare medical metrics in one dashboard.</p>
        
        <div class="ecg-container">
            <svg class="ecg-line" viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg">
                <path class="ecg-path" d="M 0 30 L 90 30 L 100 20 L 110 40 L 120 0 L 130 60 L 140 30 L 150 30 L 160 25 L 170 35 L 180 30 L 300 30" fill="none" stroke="url(#ecgGradient)" stroke-width="3" stroke-linecap="round" />
                <linearGradient id="ecgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#a200ff" stop-opacity="0.2" />
                    <stop offset="50%" stop-color="#0066ff" />
                    <stop offset="100%" stop-color="#00d4ff" />
                </linearGradient>
            </svg>
        </div>

        <div class="enter-prompt">Click anywhere to enter workspace</div>
    </div>

    <div class="transition-overlay" id="overlay"></div>

    <script>
        // Clicking anywhere redirects to the login page with a beautiful fade transition
        document.body.addEventListener('click', function() {
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = '1';
            setTimeout(function() {
                window.location.href = "{{ url_for('login') }}";
            }, 500); // match transition speed
        });
    </script>
</body>
</html>
